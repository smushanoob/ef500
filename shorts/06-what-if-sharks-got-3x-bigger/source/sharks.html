function sharkCount(t) { if (t < T.hookTwice) return 1.4; if (t < ST.crash) return lerp(1.4, 2.8, easeOut((t - T.hookTwice) / 0.8));
  const u = clamp((t - ST.crash - 0.3) / (Wd('end', 'today') - ST.crash + 0.2)); return u < 0.25 ? 2.8 : lerp(2.8, 0.9, ss(0.25, 0.85, u)); }

}
function footChip(t, sh) { if (!sh || !sh.credit) return; const a = ss(sh.t0, sh.t0 + 0.3, t); ctx.save(); ctx.globalAlpha = a * 0.92; badge('REAL FOOTAGE · ' + sh.label, 30, 300, 20, 'rgba(0,0,0,0.6)', '#fff', 1, 'left', 14, 36); ctx.restore(); }

// =====================================================================
//  FRAME
// =====================================================================
window.renderFrame = async (t) => {

};

  }
