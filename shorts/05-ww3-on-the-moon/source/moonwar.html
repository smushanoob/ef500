    L('SHACKLETON', 'SHACKLETON', ST.ice + 1.4, ST.earth, '#bfe8ff'); L('HAWORTH', 'HAWORTH', ST.ice + 1.8, ST.earth, '#bfe8ff'); L('SHOEMAKER', 'SHOEMAKER', ST.ice + 2.1, ST.earth, '#bfe8ff');
    L('DE GERLACHE', 'DEGERLACHE', ST.lastpush - 0.3, ST.totals, '#bfe8ff');
    L('TRANQUILITY BASE', 'TRANQUILITY', Wd('teams', 'america'), ST.pact, '#fff'); L('TRANQUILITY BASE', 'TRANQUILITY', ST.counter - 0.2, ST.counter + 4, '#fff');
    L('VON KÁRMÁN', 'VONKARMAN', Wd('pact', 'china'), ST.ice, '#fff'); L('MARE MOSCOVIENSE', 'MOSCOVIENSE', Wd('pact', 'russia'), ST.ice, '#fff'); L('MARE MOSCOVIENSE', 'MOSCOVIENSE', ST.massdriver, ST.counter, '#fff');
    L('SHIV SHAKTI POINT', 'SHIVSHAKTI', ST.india - 0.2, ST.crisium, '#ffd28a'); L('MARE CRISIUM', 'CRISIUM', ST.crisium - 0.2, ST.massdriver, '#fff');
    // mass driver: rocks flung into orbit
    if (t > ST.massdriver + 1 && t < Wd('raid', 'apart')) { const p = project(...P.MOSCOVIENSE); if (p.vis) for (let k = 0; k < 4; k++) { const ph = ((t * 0.9 + k * 0.25) % 1); const q = project(P.MOSCOVIENSE[0] + 4 + ph * 30, P.MOSCOVIENSE[1] - 10 - ph * 40, 1 + ph * 0.8); ctx.save(); ctx.strokeStyle = 'rgba(255,90,60,0.9)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.globalAlpha = 1 - ph; ctx.stroke(); ctx.restore(); } }
    // arrows, battles, units
    ARROWS.forEach(A => drawArrow(A, tm));
    BATTLES.forEach(B => drawBattle(B, t < ST.teams - 0.4 ? tm : t));
    const zoomS = mcam.userData.zoomPx;
    UNITS.forEach(u => { const pos = unitPos(u, tm); if (!pos || tm > u.tOff + 0.5) return; const p = project(pos[0], pos[1], 1.004); if (!p.vis) return;
      const a = (t < ST.teams - 0.4 ? 1 : ss(pos[2], pos[2] + 0.35, t)) * (1 - ss(u.tOff, u.tOff + 0.5, tm)) * clamp((p.f - 0.08) * 5) * (1 - 0.85 * moonMat.uniforms.storm.value);
      const pop = t < ST.teams - 0.4 ? 1 : 1 + 0.35 * (1 - easeOut((t - pos[2]) / 0.3)); counter(p.x, p.y, u.c, u.type, zoomS > 0.6 ? u.label : '', a, t, Math.max(0.55, Math.min(1.0, zoomS * 0.95)) * pop); });
    // radiation banner
    const st = moonMat.uniforms.storm.value; if (st > 0.02) { ctx.save(); ctx.globalAlpha = st; for (let i = 0; i < 40; i++) { const y = 470 + ((i * 97 + t * 900) % 880); ctx.strokeStyle = 'rgba(255,220,120,0.35)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-50 + (i * 53) % 1100, y); ctx.lineTo(60 + (i * 53) % 1100, y + 60); ctx.stroke(); } rr(240, 492, 600, 64, 12); ctx.fillStyle = 'rgba(255,190,0,0.92)'; ctx.fill(); txt('☢ RADIATION ALERT ☢', 540, 524, 34, '#000', 'center', 900, 0); ctx.restore(); }
    // treaty banner
    if (t > Wd('treaty', 'treaty') - 0.1 && t < ST.end + 2) { const a = ss(Wd('treaty', 'treaty') - 0.1, Wd('treaty', 'treaty') + 0.3, t) * (1 - ss(ST.end + 1.5, ST.end + 2, t)); ctx.save(); ctx.globalAlpha = a; rr(150, 492, 780, 70, 14); ctx.fillStyle = 'rgba(20,120,70,0.92)'; ctx.fill(); txt('TREATY OF TRANQUILITY', 540, 527, 36, '#fff', 'center', 900, 0); ctx.restore(); }
    // CTA
    if (t > ST.cta - 0.2) { const a = ss(ST.cta - 0.2, ST.cta + 0.3, t); ctx.save(); ctx.globalAlpha = a; rr(120, 488, 840, 84, 16); ctx.fillStyle = 'rgba(255,212,0,0.95)'; ctx.fill(); txt('WHICH SIDE WOULD YOU JOIN? ⬇', 540, 530, 38, '#111', 'center', 900, 0); ctx.restore(); }
    legend(t);
  }
  header(t); bars(t); newsPanel(t);
  return out.toDataURL('image/jpeg', 0.92);
};
window.TIMES = ST; window.CAMK = camKey; window.CKS = CK; window.READY = true;
